services:
  - type: web
    name: phishguard-backend
    runtime: node
    plan: free
    buildCommand: node scripts/prepare-prisma.js && npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: phishguard-db
    databaseName: phishguard
    user: phishguard_user
    plan: free
